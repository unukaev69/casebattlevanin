<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CS:GO Case Battle</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;padding:10px;font-family:sans-serif;background:#0b0e14;color:#fff;display:flex;flex-direction:column;align-items:center}
.box{width:100%;max-width:1050px;background:#151b26;border:1px solid #263042;border-radius:14px;padding:14px;margin-bottom:14px}
.flex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.btn{background:#f59e0b;color:#000;border:none;padding:10px 18px;font-weight:bold;border-radius:8px;cursor:pointer}.btn:disabled{background:#334155;color:#64748b}
.tab{background:#1e2636;color:#94a3b8;border:1px solid #334155;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer}.tab.act{background:#f59e0b;color:#000}
.coin{width:60px;height:60px;border-radius:50%;background:radial-gradient(#fde047,#f59e0b);border:3px solid #fef08a;display:flex;justify-content:center;align-items:center;font-size:1.6rem;font-weight:900;color:#78350f;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#1e2636;border:2px solid #263042;border-radius:12px;padding:12px;text-align:center;cursor:pointer;position:relative}.card:hover{border-color:#f59e0b}
.badge{position:absolute;top:5px;right:5px;font-size:.6rem;padding:2px 5px;border-radius:4px;background:#ec4899;font-weight:bold}
.roulette{position:relative;width:100%;height:135px;background:#0b0e14;border-radius:10px;overflow:hidden;margin:12px 0;border:2px solid #334155}
.ptr{position:absolute;top:0;left:50%;width:4px;height:100%;background:#f59e0b;z-index:10}.strip{display:flex;height:100%;align-items:center}
.item{min-width:135px;height:115px;margin:0 4px;background:#1e2636;border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:5px;border-bottom:4px solid #3b82f6;flex-shrink:0;text-align:center;font-size:.75rem}
.r-purple{border-color:#a855f7}.r-pink{border-color:#ec4899}.r-red{border-color:#ef4444}.r-gold{border-color:#eab308;background:#2a2210}
.arena{display:grid;grid-template-columns:1fr 180px 1fr;gap:12px;align-items:center;margin:12px 0}@media(max-width:700px){.arena{grid-template-columns:1fr}}
.slot{background:#0b0e14;border:2px dashed #334155;border-radius:12px;height:160px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px;text-align:center}.slot.fill{border-style:solid;border-color:#f59e0b;background:#1e2636}
.wheel{width:170px;height:170px;border-radius:50%;margin:0 auto;position:relative;border:5px solid #263042;display:flex;justify-content:center;align-items:center}
.orbit{position:absolute;inset:-8px;pointer-events:none}.needle{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid #f59e0b;margin:0 auto}
.m-btn{border:none;padding:4px;border-radius:5px;font-weight:bold;cursor:pointer;font-size:.7rem;color:#fff;margin-top:4px;width:100%}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:99}
.mbox{background:#151b26;border:2px solid #f59e0b;border-radius:16px;padding:24px;text-align:center;max-width:340px;width:90%}
</style>
</head>
<body>
<div class="box flex">

    <button class="tab" id="t-u" onclick="tab('u')">⚡ Апгрейд</button>
    <button class="tab" id="t-m" onclick="tab('m')">🔮 Магия</button>
    <button class="tab" id="t-k" onclick="tab('k')">📜 Контракты</button>
  </div>
  <div style="font-size:1.3rem;font-weight:bold;color:#10b981"><span id="bal">100</span> ₽</div>
</div>

<div class="box flex">

    <div style="text-align:center"><button class="btn" id="spinBtn" onclick="spin()">ОТКРЫТЬ</button></div>
  </div>
</div>

<div id="v-u" class="box" style="display:none">

    <div class="slot" id="uT">Цель</div>

</div>

<div id="v-m" class="box" style="display:none">

    <div style="font-size:4rem;text-align:center" id="cald">🔮</div>

  </div>
  <div style="text-align:center"><button class="btn" style="background:#c026d3;color:#fff" id="mBtn" onclick="runM()" disabled>ЗАПУСТИТЬ МАГИЮ</button><div id="mMsg" style="margin-top:8px;font-weight:bold"></div></div>
</div>

<div id="v-k" class="box" style="display:none">
  <div style="text-align:center;margin-bottom:10px">Выбрано: <b id="kCnt">0</b>/10 (мин. 3) | Сумма: <b id="kSum" style="color:#fbbf24">0</b> ₽</div>
  <div style="text-align:center"><button class="btn" id="kBtn" onclick="runK()" disabled>ПОДПИСАТЬ КОНТРАКТ</button> <button class="tab" onclick="kIdx=[];renInv();renK()">Сброс</button><div id="kMsg" style="margin-top:8px;font-weight:bold"></div></div>
</div>

<div class="box">

  <div class="grid" id="invG"></div>
</div>

<div class="modal" id="mod"><div class="mbox">

</div></div>
