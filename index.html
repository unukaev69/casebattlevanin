<style>
*{box-sizing:border-box;user-select:none}
body{margin:0;padding:12px;font-family:'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at 20% 0%,#1e1b4b 0%,transparent 50%),radial-gradient(circle at 80% 10%,#4c0519 0%,transparent 45%),#080a10;background-attachment:fixed;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.box{width:100%;max-width:1140px;background:rgba(17,22,34,.92);backdrop-filter:blur(10px);border:1px solid #263147;box-shadow:0 10px 30px rgba(0,0,0,.6);border-radius:16px;padding:16px;margin-bottom:16px}
.flex{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.btn{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);border:none;padding:11px 20px;font-weight:800;border-radius:10px;cursor:pointer;transition:.15s;letter-spacing:.3px}.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:disabled{background:#232b3e;color:#5c6882;cursor:not-allowed;transform:none}
.btn-fast{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.tab{background:#192030;color:#94a3b8;border:1px solid #2c3852;padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;transition:.15s}.tab:hover{color:#fff;border-color:#f59e0b}.tab.act{background:linear-gradient(135deg,#f59e0b,#d97706);color:#090b10;border-color:#fbbf24}
.coin{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fef08a,#f59e0b 65%,#b45309);border:3px solid #fef08a;box-shadow:0 0 20px rgba(245,158,11,.5);display:flex;justify-content:center;align-items:center;font-size:1.7rem;font-weight:900;color:#78350f;cursor:pointer;transition:.06s}.coin:active{transform:scale(.9)}
.cat-title{font-size:1.1rem;font-weight:800;color:#f8fafc;margin:18px 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.5px}
.cat-title span{height:3px;flex:1;background:linear-gradient(90deg,#334155,transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{background:linear-gradient(180deg,#1a2234 0%,#101522 100%);border:1px solid #2a354d;border-radius:14px;padding:12px 10px;text-align:center;cursor:pointer;position:relative;transition:.2s;overflow:hidden}
.card:hover{border-color:#f59e0b;transform:translateY(-4px);box-shadow:0 10px 24px rgba(245,158,11,.25)}
.card.vip{border-color:#eab308;background:linear-gradient(180deg,#2e2108 0%,#121624 100%);box-shadow:0 0 18px rgba(234,179,8,.18)}
.case-box3d{width:110px;height:84px;margin:4px auto 8px;border-radius:12px;display:flex;justify-content:center;align-items:center;position:relative;box-shadow:inset 0 2px 10px rgba(255,255,255,.25),inset 0 -8px 16px rgba(0,0,0,.7),0 6px 14px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.2)}
.badge{position:absolute;top:7px;right:7px;font-size:.58rem;padding:2px 6px;border-radius:5px;background:#ec4899;font-weight:900;color:#fff;z-index:2;letter-spacing:.4px}
.vip .badge{background:#eab308;color:#000}
.mult-bar{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
.m-pill{background:#182032;border:1px solid #2e3b57;color:#cbd5e1;padding:6px 14px;border-radius:8px;font-weight:800;cursor:pointer}.m-pill.act{background:#f59e0b;color:#000;border-color:#fde047}
.roulettes-wrap{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.roulette{position:relative;width:100%;height:118px;background:#07090f;border-radius:10px;overflow:hidden;border:2px solid #2c3852;box-shadow:inset 0 0 20px rgba(0,0,0,.9)}
.ptr{position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:100%;background:#f59e0b;box-shadow:0 0 10px #f59e0b;z-index:10}
.strip{display:flex;height:100%;align-items:center;will-change:transform}
.item{width:132px;min-width:132px;height:102px;margin:0 4px;background:linear-gradient(180deg,#1e273b,#121826);border-radius:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:5px;border-bottom:4px solid #38bdf8;flex-shrink:0;text-align:center;font-size:.72rem}
.item-pic{width:54px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:3px}
.r-purple{border-color:#a855f7}.r-pink{border-color:#ec4899}.r-red{border-color:#ef4444}.r-gold{border-color:#eab308;background:linear-gradient(180deg,#362709,#171c2b)}
.arena{display:grid;grid-template-columns:1fr 190px 1fr;gap:12px;align-items:center;margin:12px 0}@media(max-width:700px){.arena{grid-template-columns:1fr}}
.slot{background:#090c14;border:2px dashed #2e3b57;border-radius:12px;height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px;text-align:center}.slot.fill{border-style:solid;border-color:#f59e0b;background:#1a2234}
.wheel{width:170px;height:170px;border-radius:50%;margin:0 auto;position:relative;border:5px solid #2e3b57;display:flex;justify-content:center;align-items:center}
.orbit{position:absolute;inset:-8px;pointer-events:none}.needle{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:15px solid #f59e0b;margin:0 auto}
.cauldron{width:160px;height:160px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,#9333ea,#3b0764);border:4px solid #e879f9;box-shadow:0 0 28px rgba(217,70,239,.5);display:flex;justify-content:center;align-items:center;font-size:3.6rem}
@keyframes mSpin{0%{transform:rotate(0) scale(1);filter:hue-rotate(0deg)}50%{transform:rotate(180deg) scale(1.12);filter:hue-rotate(180deg)}100%{transform:rotate(360deg) scale(1);filter:hue-rotate(360deg)}}
.m-active{animation:mSpin 1s infinite linear}
.m-btn{border:none;padding:5px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:.7rem;color:#fff;margin-top:4px;width:100%}
.modal{display:none;position:fixed;inset:0;background:rgba(4,6,12,.9);justify-content:center;align-items:center;z-index:99;padding:12px}
.mbox{background:#131926;border:2px solid #f59e0b;box-shadow:0 0 35px rgba(245,158,11,.35);border-radius:18px;padding:22px;text-align:center;max-width:560px;width:100%;max-height:90vh;overflow-y:auto}

</head>

  {sec:"💎 Спец-коллекции CS:GO",n:"Брелки",p:39,i:"🧸",b:"БРЕЛОК",c:"b",g:["#7c3aed","#2e1065"],sp:{n:"★ Золотой Дракон",e:"🐉",r:"gold"}},
  {sec:"💎 Спец-коллекции CS:GO",n:"Капсулы",p:49,i:"💊",b:"КАПСУЛА",c:"s",g:["#0369a1","#0c4a6e"],sp:{n:"★ iBUYPOWER Kato 14",e:"🔥",r:"gold"}},
  {sec:"💎 Спец-коллекции CS:GO",n:"Музыка",p:79,i:"🎧",b:"МУЗЫКА",c:"m",g:["#6d28d9","#1e1b4b"],sp:{n:"★ Hotline Miami",e:"🌴",r:"gold"}},
  {sec:"💎 Спец-коллекции CS:GO",n:"Пины",p:129,i:"🏅",b:"ПИН",c:"p",g:["#0d9488","#042f2e"],sp:{n:"★ Пин Вой",e:"🐺",r:"gold"}},
function tab(x){if(busy)return;['c','u','m','k'].forEach(t=>{document.getElementById('v-'+t).style.display=t===x?'block':'none';document.getElementById('t-'+t).classList.toggle('act',t===x)});if(x==='c')closeC();if(x==='u')renU();if(x==='m')renM();if(x==='k')renK()}
function farm(){bal+=inc;upd()}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.getElementById('mod').style.display!=='flex'){e.preventDefault();farm()}});
function buyClick(){if(bal>=uCost){bal-=uCost;inc++;uCost=Math.round(uCost*1.7);upd()}}
function getAdjustedRoll(baseP,baseU){let pCh=baseP,uCh=baseU;if(globalWinStreak>=3){pCh*=0.15;uCh=0}else if(globalWinStreak===2){pCh*=0.35;uCh*=0.2}else if(globalWinStreak===1){pCh*=0.7}else if(globalLoseStreak>=5){pCh=Math.min(60,pCh*1.35)}return{pCh,uCh}}
function drop(c,vis=false){const r=Math.random()*100,pl=P[c.c],adj=vis?{pCh:35,uCh:2}:getAdjustedRoll(c.v?25:33,c.v?0.08:0.1);if(r<adj.uCh){if(!vis){globalWinStreak++;globalLoseStreak=0}const a=[...pl.u,c.sp],t=a[Math.floor(Math.random()*a.length)];return{n:t.n,e:t.e,r:'gold',p:Math.round(c.p*(8+Math.random()*10)),t:'u'}}if(r<adj.uCh+adj.pCh){if(!vis){globalWinStreak++;globalLoseStreak=0}const t=pl.p[Math.floor(Math.random()*pl.p.length)];return{n:t.n,e:t.e,r:t.r,p:Math.round(c.p*(1.15+Math.random()*1.35)),t:'p'}}if(!vis){globalLoseStreak++;globalWinStreak=0}const t=pl.c[Math.floor(Math.random()*pl.c.length)];return{n:t.n,e:t.e,r:t.r,p:Math.max(1,Math.round(c.p*(0.15+Math.random()*0.45))),t:'c'}}
function init(){const root=document.getElementById('lobby');root.innerHTML='';const groups={};C.forEach((c,i)=>{if(!groups[c.sec])groups[c.sec]=[];groups[c.sec].push({c,i})});Object.keys(groups).forEach(sec=>{const h=document.createElement('div');h.className='cat-title';h.innerHTML=`${sec} <span></span>`;root.appendChild(h);const g=document.createElement('div');g.className='grid';groups[sec].forEach(({c,i})=>{const d=document.createElement('div');d.className='card'+(c.v?' vip':'');d.onclick=()=>openC(i);d.innerHTML=`${c.b?`<div class="badge">${c.b}</div>`:''}${mkCaseArt(c.i,c.g[0],c.g[1])}<b>${c.n}</b><div style="color:#10b981;font-weight:900;margin-top:5px">${c.p.toLocaleString('ru-RU')} ₽</div>`;g.appendChild(d)});root.appendChild(g)});upd()}
function setOpenCnt(n,btn){if(busy)return;openCnt=n;document.querySelectorAll('#multBar .m-pill').forEach(b=>b.classList.remove('act'));btn.classList.add('act');buildStrips();upd()}
function buildStrips(){const wrap=document.getElementById('rWrap');wrap.innerHTML='';const c=C[curC];for(let r=0;r<openCnt;r++){const box=document.createElement('div');box.className='roulette';box.innerHTML=`<div class="ptr"></div><div class="strip" id="st-${r}"></div>`;wrap.appendChild(box);const st=box.querySelector('.strip');for(let k=0;k<10;k++)st.appendChild(mkI(drop(c,true)))}}
function openC(i){if(busy)return;curC=i;document.getElementById('lobby').style.display='none';document.getElementById('openV').style.display='block';document.getElementById('cName').innerText=C[i].i+' '+C[i].n;buildStrips();upd()}
function closeC(){if(!busy){document.getElementById('openV').style.display='none';document.getElementById('lobby').style.display='block'}}
function mkI(x){const d=document.createElement('div');d.className='item '+(x.r?'r-'+x.r:'');d.innerHTML=`${mkItemArt(x.e,x.r)}<b>${x.n}</b><b style="color:#10b981;margin-top:2px">${x.p.toLocaleString('ru-RU')} ₽</b>`;return d}
function spin(isFast){const c=C[curC],totCost=c.p*openCnt;if(busy||bal<totCost)return;bal-=totCost;busy=1;upd();wItems=[];const dur=isFast?0.35:3.4;for(let r=0;r<openCnt;r++){const st=document.getElementById('st-'+r);st.style.transition='none';st.style.transform='translateX(0)';st.innerHTML='';let w=null;const winIdx=34;for(let i=0;i<42;i++){const it=drop(c,i!==winIdx);if(i===winIdx)w=it;st.appendChild(mkI(it))}wItems.push(w);const winCard=st.children[winIdx],boxW=st.parentElement.clientWidth,tx=(winCard.offsetLeft+(winCard.offsetWidth/2))-(boxW/2)+(isFast?0:(Math.random()*24-12));setTimeout(()=>{st.style.transition=`transform ${dur}s cubic-bezier(.1,.85,.15,1)`;st.style.transform=`translateX(-${tx}px)`},25)}setTimeout(()=>{busy=0;upd();const wg=document.getElementById('wGrid');wg.innerHTML='';let sum=0;wItems.forEach(w=>{sum+=w.p;const el=document.createElement('div');el.className='item '+(w.r?'r-'+w.r:'');el.style.width='auto';el.style.minWidth='0';el.style.margin='0';el.innerHTML=`${mkItemArt(w.e,w.r)}<b>${w.n}</b><b style="color:#10b981">${w.p.toLocaleString('ru-RU')} ₽</b>`;wg.appendChild(el)});document.getElementById('wTitle').innerText=openCnt>1?`🎉 ОТКРЫТО КЕЙСОВ: ${openCnt} ШТ.`:'🎉 ВАШ ВЫИГРЫШ';document.getElementById('wTotal').innerText=sum.toLocaleString('ru-RU')+' ₽';document.getElementById('mod').style.display='flex'},(dur*1000)+140)}
function sellW(){if(wItems.length){bal+=wItems.reduce((a,b)=>a+b.p,0);wItems=[];upd()}document.getElementById('mod').style.display='none'}
function keepW(){if(wItems.length){inv.push(...wItems);wItems=[];renInv()}document.getElementById('mod').style.display='none'}
function byPr(pr){const a=pr>=2500?P.w.u:(pr>=120?P.w.p:P.w.c),t=a[Math.floor(Math.random()*a.length)];return{n:t.n,e:t.e,r:pr>=2500?'gold':(pr>=120?'red':''),p:Math.max(1,Math.round(pr))}}
function setM(m,ch,b){if(busy)return;uM=m;uCh=ch;document.querySelectorAll('#v-u .tab').forEach(x=>x.classList.remove('act'));b.classList.add('act');document.getElementById('uCh').innerText=ch+'%';document.getElementById('whl').style.background=`conic-gradient(#10b981 0% ${ch}%,#1e293b ${ch}% 100%)`;renU()}
function renU(){const s=document.getElementById('uS'),t=document.getElementById('uT'),b=document.getElementById('uBtn');if(uI===null||!inv[uI]){uI=null;s.className='slot';s.innerHTML='Выбери предмет';t.className='slot';t.innerHTML='Цель';b.disabled=1;return}const it=inv[uI];uTrg=byPr(it.p*uM);s.className='slot fill';s.innerHTML=`${mkItemArt(it.e,it.r)}<b>${it.n}</b><b style="color:#10b981">${it.p.toLocaleString('ru-RU')} ₽</b>`;t.className='slot fill';t.innerHTML=`${mkItemArt(uTrg.e,uTrg.r)}<b>${uTrg.n}</b><b style="color:#fde047">${uTrg.p.toLocaleString('ru-RU')} ₽</b>`;b.disabled=busy}
function runU(){if(busy||uI===null)return;busy=1;upd();let rc=uCh;if(globalWinStreak>=2)rc=Math.min(8,uCh*0.2);else if(globalWinStreak===1)rc=uCh*0.55;else if(globalLoseStreak>=4)rc=Math.min(80,uCh+12);const ok=(Math.random()*100)<rc,sec=(uCh/100)*360,stop=ok?(8+Math.random()*Math.max(4,sec-16)):(sec+8+Math.random()*Math.max(10,360-sec-16));ang+=1800+(360-(ang%360))+stop;const o=document.getElementById('orb');o.style.transition='transform 3.2s cubic-bezier(.15,.85,.2,1)';o.style.transform=`rotate(${ang}deg)`;setTimeout(()=>{busy=0;const m=document.getElementById('uMsg');if(ok){globalWinStreak++;globalLoseStreak=0;inv[uI]=uTrg;m.innerText='✅ ЗАЛЕТЕЛО!';m.style.color='#10b981'}else{globalLoseStreak++;globalWinStreak=0;del(uI);m.innerText='❌ СГОРЕЛО!';m.style.color='#ef4444'}upd();renInv();renU()},3300)}
function renM(){const s=document.getElementById('mS'),b=document.getElementById('mBtn');if(mI===null||!inv[mI]){mI=null;s.className='slot';s.innerHTML='Выбери предмет';b.disabled=1;return}const it=inv[mI];s.className='slot fill';s.innerHTML=`${mkItemArt(it.e,it.r)}<b>${it.n}</b><b style="color:#10b981">${it.p.toLocaleString('ru-RU')} ₽</b>`;b.disabled=busy}
function runM(){if(busy||mI===null)return;busy=1;upd();const bp=inv[mI].p,cald=document.getElementById('cald'),rs=document.getElementById('mR'),msg=document.getElementById('mMsg');cald.classList.add('m-active');msg.innerText='🔮 Магия перебирает артефакты (4 сек)...';msg.style.color='#e879f9';const r=Math.random()*100;let winAllow=globalWinStreak<2,np=1;if(winAllow&&r<0.4){np=bp*(4+Math.random()*6);globalWinStreak++;globalLoseStreak=0}else if(winAllow&&r<11){np=bp*(1.15+Math.random()*0.55);globalWinStreak++;globalLoseStreak=0}else{np=Math.max(1,bp*(0.05+Math.random()*0.32));globalLoseStreak++;globalWinStreak=0}const finalSkin=byPr(np);let step=0;function nextPreview(){step++;if(step>=16){cald.classList.remove('m-active');inv[mI]=finalSkin;busy=0;rs.className='slot fill';rs.innerHTML=`${mkItemArt(finalSkin.e,finalSkin.r)}<b>${finalSkin.n}</b><b style="color:#fde047">${finalSkin.p.toLocaleString('ru-RU')} ₽</b>`;msg.innerText=finalSkin.p>=bp?`✅ МАГИЯ В ПЛЮС! ${finalSkin.p.toLocaleString('ru-RU')} ₽`:`📉 МАГИЯ В МИНУС... ${finalSkin.p.toLocaleString('ru-RU')} ₽`;msg.style.color=finalSkin.p>=bp?'#10b981':'#ef4444';upd();renInv();renM();return}const fake=byPr(bp*(0.1+Math.random()*4));rs.className='slot fill';rs.innerHTML=`${mkItemArt(fake.e,fake.r)}<b>${fake.n}</b><b style="color:#94a3b8">${fake.p.toLocaleString('ru-RU')} ₽</b>`;setTimeout(nextPreview,100+(step*18))}nextPreview()}
function renK(){kIdx=kIdx.filter(i=>inv[i]);let s=0;kIdx.forEach(i=>s+=inv[i].p);document.getElementById('kCnt').innerText=kIdx.length;document.getElementById('kSum').innerText=s.toLocaleString('ru-RU');document.getElementById('kBtn').disabled=busy||kIdx.length<3}
function runK(){if(busy||kIdx.length<3)return;let s=0;kIdx.forEach(i=>s+=inv[i].p);[...kIdx].sort((a,b)=>b-a).forEach(i=>del(i));kIdx=[];const maxMult=globalWinStreak>=2?0.75:1.85,resPrice=s*(0.35+Math.random()*(maxMult-0.35));if(resPrice>=s){globalWinStreak++;globalLoseStreak=0}else{globalLoseStreak++;globalWinStreak=0}const res=byPr(resPrice);inv.push(res);const m=document.getElementById('kMsg');m.innerText=`📜 Получен ${res.n} (${res.p.toLocaleString('ru-RU')} ₽)`;m.style.color=res.p>=s?'#10b981':'#f59e0b';renInv();renK()}
function del(i){if(uI===i)uI=null;else if(uI!==null&&i<uI)uI--;if(mI===i)mI=null;else if(mI!==null&&i<mI)mI--;kIdx=kIdx.filter(x=>x!==i).map(x=>x>i?x-1:x);inv.splice(i,1)}
function sellAll(){if(!busy&&inv.length){bal+=inv.reduce((a,b)=>a+b.p,0);inv=[];uI=null;mI=null;kIdx=[];upd();renInv();renU();renM();renK()}}
function renInv(){document.getElementById('iCnt').innerText=inv.length;const g=document.getElementById('invG');g.innerHTML='';inv.forEach((it,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`${mkItemArt(it.e,it.r)}<small><b>${it.n}</b></small><div style="color:#10b981;font-weight:bold;margin:3px 0">${it.p.toLocaleString('ru-RU')} ₽</div><button class="m-btn" style="background:#10b981;color:#000" onclick="if(!busy){bal+=${it.p};del(${i});upd();renInv()}">Продать</button><button class="m-btn" style="background:#8b5cf6" onclick="if(!busy){uI=${i};tab('u')}">⚡ Ап</button><button class="m-btn" style="background:#c026d3" onclick="if(!busy){mI=${i};tab('m')}">🔮 Магия</button><button class="m-btn" style="background:#2563eb" onclick="if(!busy){kIdx.includes(${i})?kIdx.splice(kIdx.indexOf(${i}),1):kIdx.length<10&&kIdx.push(${i});renInv();renK()}">${kIdx.includes(i)?'✅ В контр.':'📜 В контр.'}</button>`;g.appendChild(d)})}
function upd(){document.getElementById('bal').innerText=bal.toLocaleString('ru-RU');document.getElementById('inc').innerText=inc;document.getElementById('uCost').innerText=uCost.toLocaleString('ru-RU');document.getElementById('uClick').disabled=busy||bal<uCost;document.getElementById('backCBtn').disabled=busy;document.querySelectorAll('#multBar .m-pill').forEach(b=>b.disabled=busy);const b=document.getElementById('spinBtn'),fb=document.getElementById('fastBtn'),c=C[curC];if(b&&c){const tot=c.p*openCnt;b.innerText=`ОТКРЫТЬ x${openCnt} (${tot.toLocaleString('ru-RU')} ₽)`;b.disabled=busy||bal<tot}if(fb&&c){fb.innerText=`⚡ БЫСТРО x${openCnt}`;fb.disabled=busy||bal<(c.p*openCnt)}const ub=document.getElementById('uBtn');if(ub&&uI!==null)ub.disabled=busy;const mb=document.getElementById('mBtn');if(mb&&mI!==null)mb.disabled=busy}
init();
</script>
