<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Case Battle — Все Кейсы, Апгрейды и Контракты</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0b0e14;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .header {
            width: 100%;
            max-width: 1120px;
            background: #151b26;
            border: 1px solid #263042;
            border-radius: 16px;
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 1.35rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #f59e0b;
            cursor: pointer;
        }
        .logo span { color: #ffffff; }
        .nav-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: #1e2636;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 13px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover { color: #ffffff; border-color: #f59e0b; }
        .nav-btn.active {
            background: #f59e0b;
            color: #0b0e14;
            border-color: #f59e0b;
        }
        .balance {
            font-size: 1.35rem;
            font-weight: bold;
            color: #10b981;
            background: rgba(16, 185, 129, 0.12);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        /* Зона фарма (Кликер) */
        .farm-section {
            width: 100%;
            max-width: 1120px;
            background: linear-gradient(135deg, #151b26 0%, #1c2433 100%);
            border: 2px solid #263042;
            border-radius: 16px;
            padding: 14px 22px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .farm-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .coin-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fde047, #f59e0b 65%, #b45309 100%);
            border: 4px solid #fef08a;
            box-shadow: 0 0 22px rgba(245, 158, 11, 0.45), inset 0 0 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.9rem;
            font-weight: 900;
            color: #78350f;
            cursor: pointer;
            transition: transform 0.06s;
        }
        .coin-btn:hover { transform: scale(1.05); }
        .coin-btn:active { transform: scale(0.9); }
        .farm-info h3 { margin: 0 0 4px 0; color: #fbbf24; font-size: 1.02rem; }
        .farm-info p { margin: 0; color: #94a3b8; font-size: 0.85rem; }
        
        .upgrade-btn {
            background: #3b82f6;
            color: #ffffff;
            border: none;
            padding: 11px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .upgrade-btn:hover { background: #2563eb; }
        .upgrade-btn:active { transform: scale(0.96); }
        .upgrade-btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .floating-plus {
            position: fixed;
            font-weight: 900;
            font-size: 1.3rem;
            color: #fde047;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 999;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-55px) scale(1.25); }
        }

        .btn {
            background: #f59e0b;
            color: #0b0e14;
            border: none;
            padding: 13px 26px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        .btn:hover { background: #d97706; }
        .btn:active { transform: scale(0.96); }
        .btn:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        .view-box {
            display: none;
            width: 100%;
            max-width: 1120px;
            background: #151b26;
            border: 2px solid #263042;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 24px;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Главная вкладка кейсов */
        #lobbyView {
            width: 100%;
            max-width: 1120px;
        }
        .section-title {
            font-size: 1.15rem;
            font-weight: bold;
            color: #e2e8f0;
            margin: 0 0 12px 0;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 14px;
            width: 100%;
            margin-bottom: 24px;
        }
        .case-card {
            background: #151b26;
            border: 2px solid #263042;
            border-radius: 16px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .case-card:hover {
            transform: translateY(-5px);
            border-color: #f59e0b;
            background: #1c2433;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
        }
        .case-card.gta-style {
            border-color: #3b2d54;
            background: linear-gradient(180deg, #1b1528 0%, #151b26 100%);
        }
        .case-card.gta-style:hover {
            border-color: #ec4899;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25);
        }
        .case-card.special-style {
            border-color: #1e3a5f;
            background: linear-gradient(180deg, #13233a 0%, #151b26 100%);
        }
        .case-card.special-style:hover {
            border-color: #38bdf8;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
        }
        .badge-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            color: #fff;
            font-size: 0.62rem;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .badge-gta { background: #ec4899; }
        .badge-spec { background: #0284c7; }

        .case-icon { font-size: 3rem; margin-bottom: 10px; }
        .case-name { font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
        .case-price {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        /* Окно открытия кейса */
        .case-view-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid #263042;
        }
        .back-btn {
            background: #334155;
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.92rem;
        }
        .back-btn:hover { background: #475569; }
        .back-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .case-view-title {
            font-size: 1.4rem;
            font-weight: 900;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chances-badge {
            font-size: 0.8rem;
            color: #94a3b8;
            background: #0b0e14;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #263042;
        }
        .roulette-window {
            position: relative;
            width: 100%;
            height: 155px;
            background: #0b0e14;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #334155;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        .pointer {
            position: absolute;
