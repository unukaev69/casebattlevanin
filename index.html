function upd(){document.getElementById('bal').innerText=bal.toLocaleString('ru-RU');document.getElementById('inc').innerText=inc;document.getElementById('uCost').innerText=uCost.toLocaleString('ru-RU');document.getElementById('uClick').disabled=busy||bal<uCost;document.getElementById('bkBtn').disabled=busy;const tEl=document.getElementById('topCnt');if(tEl)tEl.innerText=inv.length;const b=document.getElementById('spBtn'),fb=document.getElementById('fsBtn'),c=C.at(curC);if(b&&c){b.innerText=`ОТКРЫТЬ x${qty} (${(c.p*qty).toLocaleString('ru-RU')} ₽)`;b.disabled=busy||bal<c.p*qty}if(fb&&c){fb.innerText=`⚡ БЫСТРО x${qty}`;fb.disabled=busy||bal<c.p*qty}const ub=document.getElementById('uBtn');if(ub&&uI!==null)ub.disabled=busy;const mb=document.getElementById('mBtn');if(mb&&mI!==null)mb.disabled=busy}
for(let k=0;k<12;k++)pushL();renC();upd();
