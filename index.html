function drop(c,vis=false){const r=Math.random()*100,pl=P[c.c],adj=vis?{pCh:35,uCh:2}:getAdjustedRoll(c.v?26:34,c.v?0.08:0.1);if(r<adj.uCh){if(!vis){globalWinStreak++;globalLoseStreak=0}const a=[...pl.u,c.sp],t=a[Math.floor(Math.random()*a.length)];return{n:t.n,e:t.e,r:'gold',p:Math.round(c.p*(8+Math.random()*10)),t:'u'}}if(r<adj.uCh+adj.pCh){if(!vis){globalWinStreak++;globalLoseStreak=0}const t=pl.p[Math.floor(Math.random()*pl.p.length)];return{n:t.n,e:t.e,r:t.r,p:Math.round(c.p*(1.15+Math.random()*1.4)),t:'p'}}if(!vis){globalLoseStreak++;globalWinStreak=0}const t=pl.c[Math.floor(Math.random()*pl.c.length)];return{n:t.n,e:t.e,r:t.r,p:Math.max(1,Math.round(c.p*(0.15+Math.random()*0.45))),t:'c'}}

function byPr(pr){const a=pr>=2500?P.w.u:(pr>=120?P.w.p:P.w.c),t=a[Math.floor(Math.random()*a.length)];return{n:t.n,e:t.e,r:pr>=2500?'gold':(pr>=120?'red':''),p:Math.max(1,Math.round(pr))}}

function runU(){if(busy||uI===null)return;busy=1;upd();let rc=uCh;if(globalWinStreak>=2)rc=Math.min(8,uCh*0.2);else if(globalWinStreak===1)rc=uCh*0.55;else if(globalLoseStreak>=4)rc=Math.min(80,uCh+12);const ok=(Math.random()*100)<rc,sec=(uCh/100)*360,stop=ok?(8+Math.random()*Math.max(4,sec-16)):(sec+8+Math.random()*Math.max(10,360-sec-16));ang+=1800+(360-(ang%360))+stop;const o=document.getElementById('orb');o.style.transition='transform 3.2s cubic-bezier(.15,.85,.2,1)';o.style.transform=`rotate(${ang}deg)`;setTimeout(()=>{busy=0;const m=document.getElementById('uMsg');if(ok){globalWinStreak++;globalLoseStreak=0;inv[uI]=uTrg;m.innerText='✅ ЗАЛЕТЕЛО!';m.style.color='#34d399'}else{globalLoseStreak++;globalWinStreak=0;del(uI);m.innerText='❌ СГОРЕЛО!';m.style.color='#ef4444'}upd();renInv();renU()},3300)}
