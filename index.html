);
function boxArt(w,h,g){return `<div class="ca"><div class="cg" style="background:${g}"></div><svg width="136" height="110" viewBox="0 0 144 118" style="position:relative;z-index:1"><polygon points="24,62 120,62 132,78 12,78" fill="${g}" opacity="0.6"/><rect x="18" y="76" width="108" height="36" rx="6" fill="#161b28" stroke="${g}" stroke-width="2.5"/><rect x="42" y="86" width="60" height="14" rx="3" fill="${g}"/><text x="72" y="96" fill="#fff" font-size="7.5" font-weight="900" text-anchor="middle">CASE-BATTLE</text></svg><span style="position:absolute;top:10px;left:26px;font-size:2.7rem;z-index:2;transform:rotate(-15deg)">${w}</span><span style="position:absolute;top:14px;right:22px;font-size:2.2rem;z-index:3">${h}</span></div>`}
function drop(c,vis){const r=Math.random()*100,pl=P[c.c];let pC=vis?35:(wStr>=3?4:(wStr===2?10:(wStr===1?22:(lStr>=5?48:32)))),uC=vis?2:(wStr>=2?0:0.1);if(r<uC){if(!vis){wStr++;lStr=0}const a=pl.u.concat(c.sp),t=a.at(Math.floor(Math.random()*a.length));return{n:t.n,e:t.e,r:'gold',p:Math.round(c.p*(8+Math.random()*9)),t:'u'}}if(r<uC+pC){if(!vis){wStr++;lStr=0}const t=pl.p.at(Math.floor(Math.random()*pl.p.length));return{n:t.n,e:t.e,r:t.r,p:Math.round(c.p*(1.15+Math.random()*1.3)),t:'p'}}if(!vis){lStr++;wStr=0}const t=pl.c.at(Math.floor(Math.random()*pl.c.length));return{n:t.n,e:t.e,r:t.r,p:Math.max(1,Math.round(c.p*(.15+Math.random()*.45))),t:'c'}}
function pushL(){const col=document.getElementById('lCol');if(!col)return;const it=drop(C.at(Math.floor(Math.random()*C.length)),1),d=document.createElement('div');d.className='l-it';d.style.borderLeftColor=it.r==='gold'?'#eab308':(it.r==='red'?'#ef4444':'#38bdf8');d.innerHTML=`<span style="font-size:1.3rem">${it.e}</span><div style="overflow:hidden"><b style="display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden">${it.n}</b><small style="color:#eab308">${it.p.toLocaleString('ru-RU')} ₽</small></div>`;col.prepend(d);if(col.children.length>14)col.lastChild.remove()}setInterval(pushL,3000);
function tab(x){if(busy)return;new Array('c','u','m','k','g').forEach(t=>{document.getElementById('v-'+t).style.display=t===x?'block':'none';document.getElementById('t-'+t).classList.toggle('act',t===x)});if(x==='c')closeC();if(x==='u')renU();if(x==='m')renM();if(x==='k')renK();if(x==='g')renG()}
function farm(){bal+=inc;snd('cn');upd()}document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.getElementById('mod').style.display!=='flex'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();farm()}});
function buyClick(){if(bal>=uCost){bal-=uCost;inc++;uCost=Math.round(uCost*1.7);snd('wn');upd()}}
function promo(){if(prUsed)return;prUsed=1;bal+=500;fw();upd();document.getElementById('pBtn').innerText='✅ +500 ₽';document.getElementById('pBtn').disabled=1}
function renC(){const r=document.getElementById('cRoot');r.innerHTML='';const q=document.getElementById('qInp').value.toLowerCase(),mp=Number(document.getElementById('pRng').value),av=document.getElementById('avChk').checked,gr={};C.forEach((c,i)=>{if(q&&!c.n.toLowerCase().includes(q))return;if(c.p>mp)return;if(av&&c.p>bal)return;if(!gr[c.s])gr[c.s]=new Array();gr[c.s].push({c,i})});Object.keys(gr).forEach(s=>{const h=document.createElement('div');h.className='sec';h.innerText=s;r.appendChild(h);const g=document.createElement('div');g.className='grid';gr[s].forEach(({c,i})=>{const d=document.createElement('div');d.className='cc';d.onclick=()=>openC(i);d.innerHTML=`<div style="font-weight:800;font-size:.85rem;text-transform:uppercase">${c.n}</div>${boxArt(c.w,c.h,c.g)}<div class="cp">${c.p.toLocaleString('ru-RU')} ₽</div>`;g.appendChild(d)});r.appendChild(g)})}
function setQ(n,b){if(busy)return;qty=n;document.querySelectorAll('#mBar .nb').forEach(x=>x.classList.remove('act'));b.classList.add('act');bld();upd()}
function bld(){const w=document.getElementById('rWrap');w.innerHTML='';for(let r=0;r<qty;r++){const b=document.createElement('div');b.className='r-box';b.innerHTML=`<div class="ptr"></div><div class="str" id="st-${r}"></div>`;w.appendChild(b);const s=b.querySelector('.str');for(let k=0;k<10;k++)s.appendChild(mkI(drop(C.at(curC),1)))}}
function openC(i){if(busy)return;curC=i;document.getElementById('lobby').style.display='none';document.getElementById('openV').style.display='block';document.getElementById('cName').innerText=C.at(i).n.toUpperCase();bld();upd()}
function closeC(){if(!busy){document.getElementById('openV').style.display='none';document.getElementById('lobby').style.display='block';renC()}}
function mkI(x){const d=document.createElement('div');d.className='it '+(x.r?'r-'+x.r:'');d.innerHTML=`<div style="font-size:1.8rem">${x.e}</div><b>${x.n}</b><b style="color:#eab308">${x.p.toLocaleString('ru-RU')} ₽</b>`;return d}
function spin(f){const c=C.at(curC),tc=c.p*qty;if(busy||bal<tc)return;bal-=tc;busy=1;upd();wIt=new Array();const dur=f?0.35:3.3;let tk=0,tm=setInterval(()=>{if(++tk<(f?3:22))snd('tk');else clearInterval(tm)},f?90:130);for(let r=0;r<qty;r++){const s=document.getElementById('st-'+r);s.style.transition='none';s.style.transform='translateX(0)';s.innerHTML='';let w=null;for(let i=0;i<42;i++){const it=drop(c,i!==34);if(i===34)w=it;s.appendChild(mkI(it))}wIt.push(w);const wc=s.children.item(34),bw=s.parentElement.clientWidth,tx=(wc.offsetLeft+wc.offsetWidth/2)-(bw/2)+(f?0:(Math.random()*20-10));setTimeout(()=>{s.style.transition=`transform ${dur}s cubic-bezier(.1,.85,.15,1)`;s.style.transform=`translateX(-${tx}px)`},25)}setTimeout(()=>{clearInterval(tm);busy=0;upd();const wg=document.getElementById('wGrid');wg.innerHTML='';let sm=0;wIt.forEach(w=>{sm+=w.p;const el=document.createElement('div');el.className='it '+(w.r?'r-'+w.r:'');el.style.width='auto';el.style.minWidth='0';el.style.margin='0';el.innerHTML=`<div style="font-size:1.8rem">${w.e}</div><b>${w.n}</b><b style="color:#eab308">${w.p.toLocaleString('ru-RU')} ₽</b>`;wg.appendChild(el)});if(sm>=tc)fw();else snd('ls');document.getElementById('wTot').innerText=sm.toLocaleString('ru-RU')+' ₽';document.getElementById('mod').style.display='flex'},dur*1000+140)}
function sellW(){if(wIt.length){bal+=wIt.reduce((a,b)=>a+b.p,0);wIt=new Array();snd('cn');upd()}document.getElementById('mod').style.display='none'}
function keepW(){if(wIt.length){inv=inv.concat(wIt);wIt=new Array();renI()}document.getElementById('mod').style.display='none'}
function byPr(pr){const a=pr>=2500?P.w.u:(pr>=120?P.w.p:P.w.c),t=a.at(Math.floor(Math.random()*a.length));return{n:t.n,e:t.e,r:pr>=2500?'gold':(pr>=120?'red':''),p:Math.max(1,Math.round(pr))}}
function setM(m,ch,b){if(busy)return;uM=m;uCh=ch;document.querySelectorAll('#v-u .nb').forEach(x=>x.classList.remove('act'));b.classList.add('act');document.getElementById('uCh').innerText=ch+'%';document.getElementById('whl').style.background=`conic-gradient(#f97316 0% ${ch}%,#1e2436 ${ch}% 100%)`;renU()}
function renU(){const s=document.getElementById('uS'),t=document.getElementById('uT'),b=document.getElementById('uBtn');if(uI===null||!inv.at(uI)){uI=null;s.className='sl';s.innerHTML='Выберите предмет ниже';t.className='sl';t.innerHTML='Цель';b.disabled=1;return}const it=inv.at(uI);uTrg=byPr(it.p*uM);s.className='sl fill';s.innerHTML=`<div style="font-size:2.2rem">${it.e}</div><b>${it.n}</b><b style="color:#22c55e">${it.p.toLocaleString('ru-RU')} ₽</b>`;t.className='sl fill';t.innerHTML=`<div style="font-size:2.2rem">${uTrg.e}</div><b>${uTrg.n}</b><b style="color:#eab308">${uTrg.p.toLocaleString('ru-RU')} ₽</b>`;b.disabled=busy}
function runU(){if(busy||uI===null)return;busy=1;upd();let rc=wStr>=2?Math.min(8,uCh*.2):(wStr===1?uCh*.55:uCh);const ok=Math.random()*100<rc,sec=uCh*3.6,st=ok?(8+Math.random()*Math.max(4,sec-16)):(sec+8+Math.random()*Math.max(10,360-sec-16));ang+=1800+(360-ang%360)+st;const o=document.getElementById('orb');o.style.transition='transform 3.1s cubic-bezier(.15,.85,.2,1)';o.style.transform=`rotate(${ang}deg)`;let tk=0,tm=setInterval(()=>{if(++tk<20)snd('tk');else clearInterval(tm)},140);setTimeout(()=>{clearInterval(tm);busy=0;const m=document.getElementById('uMsg');if(ok){wStr++;lStr=0;inv.splice(uI,1,uTrg);fw();m.innerText='✅ ЗАЛЕТЕЛО!';m.style.color='#22c55e'}else{lStr++;wStr=0;del(uI);snd('ls');m.innerText='❌ СГОРЕЛО';m.style.color='#ef4444'}upd();renI();renU()},3200)}
function renM(){const s=document.getElementById('mS'),b=document.getElementById('mBtn');if(mI===null||!inv.at(mI)){mI=null;s.className='sl';s.innerHTML='Выберите предмет ниже';b.disabled=1;return}const it=inv.at(mI);s.className='sl fill';s.innerHTML=`<div style="font-size:2.2rem">${it.e}</div><b>${it.n}</b><b style="color:#22c55e">${it.p.toLocaleString('ru-RU')} ₽</b>`;b.disabled=busy}
function runM(){if(busy||mI===null)return;busy=1;upd();const bp=inv.at(mI).p,cd=document.getElementById('cald'),rs=document.getElementById('mR'),ms=document.getElementById('mMsg');cd.classList.add('act-m');ms.innerText='🔮 Магия (4 сек)...';const r=Math.random()*100;let np=wStr<2&&r<11?bp*(1.15+Math.random()*2):Math.max(1,bp*(.05+Math.random()*.32));if(np>=bp){wStr++;lStr=0}else{lStr++;wStr=0}const fs=byPr(np);let st=0;function nx(){st++;snd('mg');if(st>=16){cd.classList.remove('act-m');inv.splice(mI,1,fs);busy=0;rs.className='sl fill';rs.innerHTML=`<div style="font-size:2.2rem">${fs.e}</div><b>${fs.n}</b><b style="color:#eab308">${fs.p.toLocaleString('ru-RU')} ₽</b>`;if(fs.p>=bp)fw();else snd('ls');ms.innerText=fs.p>=bp?`✅ ПЛЮС: ${fs.p} ₽`:`📉 МИНУС: ${fs.p} ₽`;upd();renI();renM();return}const fk=byPr(bp*(.1+Math.random()*3));rs.className='sl fill';rs.innerHTML=`<div style="font-size:2.2rem">${fk.e}</div><b>${fk.n}</b><b style="color:#94a3b8">${fk.p} ₽</b>`;setTimeout(nx,100+st*18)}nx()}
function renK(){kIdx=kIdx.filter(i=>inv.at(i));let s=0;const bx=document.getElementById('cSlots');bx.innerHTML='';for(let k=0;k<10;k++){const idx=kIdx.at(k),d=document.createElement('div');if(idx!==undefined&&inv.at(idx)){s+=inv.at(idx).p;d.className='cb fill';d.onclick=()=>{if(!busy){kIdx.splice(k,1);renI();renK()}};d.innerHTML=`<span style="font-size:1.3rem">${inv.at(idx).e}</span><b>${inv.at(idx).p} ₽</b>`}else{d.className='cb';d.innerText='🔫'}bx.appendChild(d)}document.getElementById('kSum').innerText=s+' ₽';document.getElementById('kRng').innerText=s?`от ${Math.max(1,Math.round(s*.35))} ₽ до ${Math.round(s*1.85)} ₽`:'0 ₽';document.getElementById('kBtn').disabled=busy||kIdx.length<3}
function runK(){if(busy||kIdx.length<3)return;let s=0;kIdx.forEach(i=>s+=inv.at(i).p);kIdx.slice().sort((a,b)=>b-a).forEach(i=>del(i));kIdx=new Array();const rp=s*(.35+Math.random()*(wStr>=2?.4:1.5));if(rp>=s){wStr++;lStr=0;fw()}else{lStr++;wStr=0;snd('ls')}const res=byPr(rp);inv.push(res);document.getElementById('kMsg').innerText=`📜 Получен ${res.n} (${res.p} ₽)`;renI();renK()}
const gv=new Array({t:"КАЖДЫЙ ЧАС",n:"AK-47 | Point Disarray",e:"🔥",p:1929,r:"pink"},{t:"КАЖДЫЙ ДЕНЬ",n:"★ Nomad Knife",e:"🗡️",p:20231,r:"gold"},{t:"КАЖДУЮ НЕДЕЛЮ",n:"Desert Eagle | Blaze",e:"🔥",p:56486,r:"red"});
function renG(){const r=document.getElementById('gRow');r.innerHTML='';gv.forEach((g,i)=>{const d=document.createElement('div');d.className='pnl';d.style.textAlign='center';d.innerHTML=`<small style="color:#94a3b8">${g.t}</small><div style="font-size:3rem;margin:8px 0">${g.e}</div><b>${g.n}</b><div style="color:#eab308;font-weight:900;margin:6px 0">${g.p} ₽</div><button class="btn" style="width:100%" onclick="jG(${i},this)">УЧАСТВОВАТЬ</button>`;r.appendChild(d)})}
function jG(i,b){b.disabled=1;b.innerText='⏳...';setTimeout(()=>{if(Math.random()<.15){inv.push({n:gv.at(i).n,e:gv.at(i).e,r:gv.at(i).r,p:gv.at(i).p});fw();renI();b.innerText='🎉 ПОБЕДА!'}else{snd('ls');b.innerText='❌ Мимо'}setTimeout(()=>{b.disabled=0;b.innerText='УЧАСТВОВАТЬ'},2000)},1000)}
function del(i){if(uI===i)uI=null;else if(uI!==null&&i<uI)uI--;if(mI===i)mI=null;else if(mI!==null&&i<mI)mI--;kIdx=kIdx.filter(x=>x!==i).map(x=>x>i?x-1:x);inv.splice(i,1)}
function sellAll(){if(!busy&&inv.length){bal+=inv.reduce((a,b)=>a+b.p,0);inv=new Array();uI=null;mI=null;kIdx=new Array();snd('cn');upd();renI();renU();renM();renK()}}
function renI(){document.getElementById('iCnt').innerText=inv.length;const g=document.getElementById('invG');g.innerHTML='';inv.forEach((it,i)=>{const d=document.createElement('div');d.className='ic';d.innerHTML=`<div style="font-size:1.9rem">${it.e}</div><small><b>${it.n}</b></small><div style="color:#eab308;font-weight:bold;margin:3px 0">${it.p} ₽</div><button class="mb" style="background:#22c55e;color:#000" onclick="if(!busy){bal+=${it.p};del(${i});snd('cn');upd();renI()}">Продать</button><button class="mb" style="background:#f97316" onclick="if(!busy){uI=${i};tab('u')}">⚡ Ап</button><button class="mb" style="background:#a855f7" onclick="if(!busy){mI=${i};tab('m')}">🔮 Магия</button><button class="mb" style="background:#2563eb" onclick="if(!busy){kIdx.includes(${i})?kIdx.splice(kIdx.indexOf(${i}),1):kIdx.length<10&&kIdx.push(${i});renI();renK()}">${kIdx.includes(i)?'✅ В контр.':'📜 В контр.'}</button>`;g.appendChild(d)})}
function upd(){document.getElementById('bal').innerText=bal.toLocaleString('ru-RU');document.getElementById('inc').innerText=inc;document.getElementById('uCost').innerText=uCost.toLocaleString('ru-RU');document.getElementById('uClick').disabled=busy||bal<uCost;document.getElementById('bkBtn').disabled=busy;const b=document.getElementById('spBtn'),fb=document.getElementById('fsBtn'),c=C.at(curC);if(b&&c){b.innerText=`ОТКРЫТЬ x${qty} (${(c.p*qty).toLocaleString('ru-RU')} ₽)`;b.disabled=busy||bal<c.p*qty}if(fb&&c){fb.innerText=`⚡ БЫСТРО x${qty}`;fb.disabled=busy||bal<c.p*qty}const ub=document.getElementById('uBtn');if(ub&&uI!==null)ub.disabled=busy;const mb=document.getElementById('mBtn');if(mb&&mI!==null)mb.disabled=busy}
for(let k=0;k<12;k++)pushL();renC();upd();
</script>
</body>
